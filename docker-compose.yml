version: "29.8.0"
services:
  web:
    image: php:8.3-apache
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
      - ./web/hardening.conf:/etc/apache2/conf-enabled/zzz-hardening.conf:ro
  db:
    image: mariadb:11
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
